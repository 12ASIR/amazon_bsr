name: BSR Daily Monitor

# 云端每日采集与出报（亚马逊美国站前台，配送邮编 10001）
# 注意：工作流只在 GitHub Actions 上运行，不涉内网；本地调试请用 --rebuild-only 离线验证。

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "采集数据源（browser 为默认前台渲染）"
        required: false
        default: browser

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 安装中文字体（图表中文不乱码）
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 执行采集并生成看板
        run: |
          python 启动.py --source ${{ github.event.inputs.source || 'browser' }} --zipcode 10001

      - name: 归档产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsr-output
          path: |
            1-数据源/bsr_history.db
            3-输出/
          retention-days: 30
